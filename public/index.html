<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2e6b3a" />
  <meta name="description" content="Mantenimiento del área verde: turnos de riego conectados al clima, responsabilidades y seguimiento." />
  <title>Área Verde UPT</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Área Verde" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="barra" id="barra" hidden>
    <div class="marca">
      <img src="favicon.svg" alt="" width="28" height="28" />
      <span>Área Verde</span>
    </div>
    <div class="quien">
      <span id="quien-nombre"></span>
      <span class="rol" id="quien-rol"></span>
      <button class="btn-link" data-accion="salir">Salir</button>
    </div>
  </header>
  <nav class="pestanas" id="pestanas" hidden></nav>
  <div id="notif" class="contenedor-notif" hidden></div>
  <main id="app" class="contenedor">
    <p class="cargando">Cargando…</p>
  </main>
  <dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
