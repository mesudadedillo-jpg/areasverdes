[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

# Sección pública para visitantes (el QR apunta a /visita)
[[redirects]]
  from = "/visita"
  to = "/visita.html"
  status = 200

[[redirects]]
  from = "/encuesta"
  to = "/visita"
  status = 301
